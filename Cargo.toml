[package]
name = "branchdojo"
version = "0.1.0"
edition = "2021"
description = "Practice real Git workflows in safe, disposable local repositories."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[[bin]]
name = "branchdojo"
path = "src/main.rs"
